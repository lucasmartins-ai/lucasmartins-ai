<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Lucas Martins — AI Systems Architect, founder of LookADev</title>
  <desc id="d">Dark banner with name, role and a terminal line from lcc.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#89b4fa"/>
      <stop offset="1" stop-color="#a6e3a1"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect x="64" y="72" width="56" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="138" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#e6e9f5">Lucas Martins</text>
  <text x="64" y="184" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#9aa3c2">AI Systems Architect · Founder @ LookADev · Bristol</text>
  <g font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="15" fill="#6c7593">
    <text x="64" y="228">Deterministic where a wrong answer is costly.</text>
    <text x="64" y="252">AI where it earns its place.</text>
  </g>
  <g transform="translate(760 70)">
    <rect width="376" height="160" rx="12" fill="#1e1e2e" stroke="#2a2f4a"/>
    <circle cx="20" cy="18" r="5" fill="#f38ba8"/><circle cx="38" cy="18" r="5" fill="#f9e2af"/><circle cx="56" cy="18" r="5" fill="#a6e3a1"/>
    <g font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14">
      <text x="20" y="58" fill="#a6e3a1">$ <tspan fill="#cdd6f4">lcc measure-session</tspan></text>
      <text x="20" y="86" fill="#9aa3c2">40 real sessions</text>
      <text x="20" y="110" fill="#89b4fa">median   −18.8% tokens</text>
      <text x="20" y="134" fill="#9aa3c2">messages 0 lost</text>
    </g>
  </g>
</svg>
