<svg fill="none" viewBox="0 0 800 160" width="100%" height="160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Neumorphic Neon Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- Retro Pixel Grid Background -->
    <pattern id="pixelGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1F2937" stroke-width="0.8" opacity="0.4"/>
      <circle cx="10" cy="10" r="1" fill="#374151" opacity="0.3"/>
    </pattern>

    <!-- Subtle Glow Filter -->
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="796" height="156" x="2" y="2" rx="16" fill="#0D1117" stroke="url(#borderGlow)" stroke-width="2" />
  <rect width="796" height="156" x="2" y="2" rx="16" fill="url(#pixelGrid)" />

  <!-- Retro Pixel Accents -->
  <!-- Top Left Pixel Star -->
  <g fill="#00F0FF" opacity="0.8">
    <rect x="30" y="25" width="4" height="4"/>
    <rect x="26" y="29" width="12" height="4"/>
    <rect x="30" y="33" width="4" height="4"/>
  </g>

  <!-- Top Right Joystick Icon -->
  <g fill="#8B5CF6" opacity="0.8">
    <rect x="740" y="25" width="8" height="4" rx="1"/>
    <rect x="742" y="29" width="4" height="10"/>
    <rect x="736" y="39" width="16" height="6" rx="2"/>
    <circle cx="739" cy="42" r="1.5" fill="#EC4899"/>
    <circle cx="749" cy="42" r="1.5" fill="#00F0FF"/>
  </g>

  <!-- Title: LOOKADEV -->
  <text x="400" y="68" fill="url(#textGlow)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="42" letter-spacing="6" text-anchor="middle" filter="url(#neonFilter)">LOOKADEV</text>

  <!-- Subtitle: Founder & Lead Developer -->
  <text x="400" y="102" fill="#E5E7EB" font-family="'Fira Code', 'Courier New', monospace" font-weight="600" font-size="15" letter-spacing="3" text-anchor="middle">LUCAS MARTINS  |  FOUNDER &amp; LEAD ENGINEER</text>

  <!-- Tagline -->
  <text x="400" y="128" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="12" letter-spacing="1" text-anchor="middle">Fullstack Architecture  •  Deterministic AI Workflows  •  Neumorphic UI</text>

  <!-- Bottom Accent Bar -->
  <rect x="250" y="142" width="300" height="2" rx="1" fill="url(#borderGlow)" />
</svg>
